# Weekly pull requests for newer build tools, test libraries, and CI actions. Robot libraries
# (WPILib, vendordeps) are updated deliberately, per WPILib release, not by this bot.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "org.wpilib.GradleRIO"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
