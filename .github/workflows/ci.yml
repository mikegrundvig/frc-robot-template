name: CI

# Runs ./gradlew ci, the same command anyone runs locally before pushing. Keep the checks in Gradle,
# not here: this file only sets up caching and uploads the results.

# Paused while the template is young, to save Actions minutes: it runs when started by hand
# (Actions tab, "Run workflow"), and on Dependabot's pull requests, so a dependency update is
# checked before it's merged. To run on every push and pull request again, restore:
#   push:
#     branches: [main]
# and drop the job's "if".
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    name: Build, check, test (${{ matrix.os }})
    # Linux, like the robot, and Windows, like most teams' laptops: a check that passes on one and
    # fails on the other has happened.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # Actions are pinned to a commit (the version beside it), so a moved tag can't change what
      # runs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Caches Gradle, dependencies, and the JDK 25 toolchain Gradle downloads on first use.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The open-source cache, on GitHub's own actions/cache, rather than the default: a
          # proprietary component under its own terms of use.
          cache-provider: basic
          # The dependency graph, submitted from the hand-started run, so GitHub alerts on the
          # libraries' own dependencies too. Off: it needs the job's `contents: write`, which can't
          # be limited to that run, and Dependabot's pull requests' runs would get it too. To turn
          # it on, set that permission on the job and uncomment:
          # dependency-graph: ${{ github.event_name == 'workflow_dispatch' && 'generate-and-submit' || 'disabled' }}
      - name: Formatting, static analysis, tests, coverage
        run: ./gradlew ci
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-${{ matrix.os }}-${{ github.sha }}
          path: |
            build/reports/
            build/test-results/
            pitwall/build/reports/
            pitwall/build/test-results/
            pitwall/docs-processor/build/reports/
            pitwall/docs-processor/build/test-results/
            build-logic/build/reports/
            build-logic/build/test-results/
            lib/*/build/reports/
            lib/*/build/test-results/
          if-no-files-found: warn
