name: CI

# Runs ./gradlew ci, the same command anyone runs locally before pushing. Keep the checks in Gradle,
# not here: this file only sets up caching and uploads the results.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Build, check, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Caches Gradle, dependencies, and the JDK 25 toolchain Gradle downloads on first use.
      - uses: gradle/actions/setup-gradle@v4
      - name: Formatting, static analysis, tests, coverage
        run: ./gradlew ci
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.sha }}
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: warn
