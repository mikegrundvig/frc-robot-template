name: Coprocessor images

# Builds each vision coprocessor's image from the repository (coprocessor/image/README.md): the
# official PhotonVision image for each board in coprocessors/coprocessors.yaml, provisioned by
# coprocessor/image/provision.sh into a common image, then one copy per computer, stamped with its
# identity and committed settings.
#
# Runs when started by hand (Actions tab, "Run workflow"), and on tags named coprocessors-*. A tag,
# or a release name given when starting it by hand, cuts one GitHub Release holding every
# computer's image, SHA256SUMS, and manifest.json. Started by hand without a name, it builds the
# images as workflow artifacts only, to try a change.
#
# The common image is built on GitHub's arm64 runners, as PhotonVision builds its own, so nothing
# is emulated. They're free for public repositories only.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release to cut, such as coprocessors-2027.1 (empty: build only, no release)"
        required: false
        default: ""
        type: string
  push:
    tags:
      - "coprocessors-*"

permissions:
  contents: read

# One build per tag or branch at a time: a second waits instead of racing the first to a release.
concurrency:
  group: coprocessor-image-${{ github.ref }}
  cancel-in-progress: false

env:
  WORK: build/coprocessor-image
  # The robot code's coprocessor tools: the health agent (installed in every image) and the
  # settings tool (stamping builds each computer's settings database with it: its arguments are
  # the computer's settings folder, the empty database, and the database to write; it prints the
  # settings hash).
  AGENT_TASK: ":coprocessor-agent:jar"
  AGENT_JAR: coprocessor/agent/build/libs/coprocessor-agent.jar
  AGENT_UNIT: coprocessor/agent/coprocessor-agent.service
  SETTINGS_TOOL: java -jar build/coprocessor-image/tools/coprocessor-agent.jar settings-db

jobs:
  plan:
    name: Check the inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      team: ${{ steps.plan.outputs.team }}
      version: ${{ steps.plan.outputs.version }}
      recipe-hash: ${{ steps.plan.outputs.recipe-hash }}
      jar-url: ${{ steps.plan.outputs.jar-url }}
      jar-sha256: ${{ steps.plan.outputs.jar-sha256 }}
      release: ${{ steps.plan.outputs.release }}
      publish: ${{ steps.plan.outputs.publish }}
      boards: ${{ steps.plan.outputs.boards }}
      computers: ${{ steps.plan.outputs.computers }}
    steps:
      # Actions are pinned to a commit (the version beside it), so a moved tag can't change what
      # runs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the image scripts
        run: |
          # The layout tests need sfdisk and mkfs.fat; here every test must run, none skipped.
          sudo apt-get update --quiet
          sudo apt-get install --yes --quiet --no-install-recommends fdisk dosfstools
          shellcheck -x -P SCRIPTDIR coprocessor/image/*.sh coprocessor/image/lib/*.sh \
            coprocessor/image/boards/*.env coprocessor/image/files/*.sh coprocessor/image/test/*.sh
          COPROC_TESTS_STRICT=1 coprocessor/image/test/run.sh
      # The table, the lock against the robot code's PhotonVision version, and the release name.
      - name: Check the table and the lock
        id: plan
        env:
          RELEASE: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release }}
        run: coprocessor/image/plan.sh --release "$RELEASE" --sha "$GITHUB_SHA"
      - name: Check the release would be new
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.plan.outputs.release }}
          FORK: ${{ github.event.repository.fork }}
        run: |
          if [[ $FORK == true ]]; then
            echo "::error::This repository is a fork: releases are cut only in the team's own repository."
            exit 1
          fi
          if gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE already exists, and a release is never replaced: choose a new name."
            exit 1
          fi
          if [[ $GITHUB_REF_TYPE != tag ]] &&
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE already exists: choose a new release name."
            exit 1
          fi
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build the health agent and the settings tool
        run: |
          ./gradlew "$AGENT_TASK"
          mkdir -p "$WORK/tools"
          cp "$AGENT_JAR" "$WORK/tools/coprocessor-agent.jar"
          cp "$AGENT_UNIT" "$WORK/tools/coprocessor-agent.service"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tools
          path: ${{ env.WORK }}/tools/
          if-no-files-found: error
          retention-days: 3

  common:
    name: Common image (${{ matrix.board }})
    needs: plan
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.boards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tools
          path: ${{ env.WORK }}/tools
      # The recipe hash covers everything that makes the common image, so a cached one is reused
      # only when nothing that makes it has changed: a change to settings alone re-stamps it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: ${{ env.WORK }}/common
          key: coprocessor-common-${{ matrix.board }}-${{ needs.plan.outputs.recipe-hash }}
      - name: Download the base image and PhotonVision, checked against the lock
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          IMAGE_URL: ${{ matrix.url }}
          IMAGE_SHA256: ${{ matrix.sha256 }}
          JAR_URL: ${{ needs.plan.outputs.jar-url }}
          JAR_SHA256: ${{ needs.plan.outputs.jar-sha256 }}
        run: |
          mkdir -p "$WORK/inputs"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$WORK/inputs/base.img.xz" "$IMAGE_URL"
          echo "$IMAGE_SHA256  $WORK/inputs/base.img.xz" | sha256sum --check --strict
          curl --fail --location --silent --show-error --retry 3 \
            --output "$WORK/inputs/photonvision.jar" "$JAR_URL"
          echo "$JAR_SHA256  $WORK/inputs/photonvision.jar" | sha256sum --check --strict
      # PhotonVision's own runner: it loop-mounts the image's root and runs the commands in a
      # chroot of it, from the repository (bind-mounted at /tmp/build). The board's name and the
      # jar's checksum were checked by plan.sh before reaching this command line.
      - name: Provision the common image
        if: steps.cache.outputs.cache-hit != 'true'
        id: provision
        uses: photonvision/photon-image-runner@e21f95977016b1959ae72de84b46fb16c0d98ecf # v2.0.0
        with:
          image_url: file://${{ github.workspace }}/build/coprocessor-image/inputs/base.img.xz
          root_location: ${{ matrix.rootLocation }}
          minimum_free_mb: ${{ matrix.minimumFreeMb }}
          shrink_image: "no"
          commands: |
            set -e
            bash coprocessor/image/provision.sh --board ${{ matrix.board }} --photonvision-jar build/coprocessor-image/inputs/photonvision.jar --photonvision-sha256 ${{ needs.plan.outputs.jar-sha256 }} --agent-jar build/coprocessor-image/tools/coprocessor-agent.jar --agent-unit build/coprocessor-image/tools/coprocessor-agent.service --smoketest-dir build/coprocessor-image/smoketest
      - name: Pack the common image and the empty settings database
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          IMAGE: ${{ steps.provision.outputs.image }}
          BOARD: ${{ matrix.board }}
        run: |
          mkdir -p "$WORK/common"
          sudo cat "$IMAGE" | xz -T0 -1 >"$WORK/common/common-$BOARD.img.xz"
          # The smoke test ran as root in the chroot, so its files are root's.
          sudo install -m 0644 -o "$(id -u)" -g "$(id -g)" \
            "$WORK/smoketest/photonvision_config/photon.sqlite" "$WORK/common/empty-photon.sqlite"
          sudo rm -f "$IMAGE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: common-${{ matrix.board }}
          path: ${{ env.WORK }}/common/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  stamp:
    name: Stamp ${{ matrix.name }}
    needs: [plan, common]
    # Stamping writes files and runs no ARM code: any runner will do.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.computers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: common-${{ matrix.board }}
          path: ${{ env.WORK }}/common
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tools
          path: ${{ env.WORK }}/tools
      # The settings tool's Java.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - name: Lay out and stamp ${{ matrix.name }}'s image
        env:
          NAME: ${{ matrix.name }}
          BOARD: ${{ matrix.board }}
          TEAM: ${{ needs.plan.outputs.team }}
          VERSION: ${{ needs.plan.outputs.version }}
          RELEASE: ${{ needs.plan.outputs.release }}
          RECIPE_HASH: ${{ needs.plan.outputs.recipe-hash }}
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --quiet --no-install-recommends fdisk dosfstools
          base="$TEAM-$NAME-pv$VERSION-$RELEASE"
          mkdir -p "$WORK/out"
          xz -dc "$WORK/common/common-$BOARD.img.xz" >"$WORK/$base.img"
          coprocessor/image/layout.sh --board "$BOARD" "$WORK/$base.img"
          # As root, to mount the image; with this PATH, for yq and the settings tool's Java.
          sudo env "PATH=$PATH" coprocessor/image/stamp-image.sh --board "$BOARD" "$WORK/$base.img" -- \
            --computer "$NAME" --release "$RELEASE" --recipe-hash "$RECIPE_HASH" \
            --photonvision-version "$VERSION" --empty-db "$WORK/common/empty-photon.sqlite" \
            --settings-tool "$SETTINGS_TOOL" --stamp-out "$WORK/out/$base.stamp.json"
          sudo chown "$(id -u):$(id -g)" "$WORK/out/$base.stamp.json"
          xz -T0 -c "$WORK/$base.img" >"$WORK/out/$base.img.xz"
          rm "$WORK/$base.img"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.name }}
          path: ${{ env.WORK }}/out/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    needs: [plan, stamp]
    # Only in the team's own repository, never a fork's, and only when a release was asked for.
    if: needs.plan.outputs.publish == 'true' && !github.event.repository.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ env.WORK }}/release
      - name: Write SHA256SUMS and manifest.json
        run: coprocessor/image/manifest.sh "$WORK/release"
      - name: Cut the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.plan.outputs.release }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # Checked again here: a release is never replaced.
          if gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE already exists, and a release is never replaced."
            exit 1
          fi
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            target=(--verify-tag)
          else
            target=(--target "$GITHUB_SHA")
          fi
          {
            echo "Coprocessor images for PhotonVision $VERSION, one per computer."
            echo "Check a download against SHA256SUMS before flashing it; coprocessor/image/README.md says how."
            echo
            echo "| Computer | Address | Board | Image |"
            echo "|---|---|---|---|"
            yq -r '.computers[] | "| " + .name + " | " + .address + " | " + .board + " | " + .image + " |"' \
              "$WORK/release/manifest.json"
          } >"$WORK/notes.md"
          gh release create "$RELEASE" --repo "$GITHUB_REPOSITORY" "${target[@]}" \
            --title "Coprocessor images $RELEASE" --notes-file "$WORK/notes.md" \
            "$WORK/release"/*.img.xz "$WORK/release/SHA256SUMS" "$WORK/release/manifest.json"
