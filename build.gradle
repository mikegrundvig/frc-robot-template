// The robot project. The standard WPILib layout, so GradleRIO, WPILib's tools, and every WPILib and
// AdvantageKit guide apply as-is. The supporting build rules live in gradle/ (see the end of file).

plugins {
    id "java"
    id "application"
    id "jacoco"
    alias(libs.plugins.gradlerio)
    alias(libs.plugins.spotless)
    alias(libs.plugins.errorprone)
    // AdvantageScope's robot assets (ascope_assets/), generated from Robots.java by every build and
    // checked against what's committed (build-logic/). A team that doesn't use AdvantageScope
    // removes this line, and nothing of it runs.
    id "frc.advantagescope-assets"
}

// Java 25, downloaded automatically when missing (settings.gradle). Nothing to install by hand.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Deploying to the robot's Systemcore. The team number is only needed to deploy. Store it once with
// ./gradlew setTeamNumber -PteamNumber=NNNN (it lives in .wpilib/wpilib_preferences.json, the file
// GradleRIO reads), or pass -PteamNumber=NNNN to a single deploy.
deploy {
    targets {
        systemcore(getTargetTypeClass("SystemCore")) {
            team = project.wpilib.getTeamOrDefault(0)
            useDefaultSystemcoreHostName()
            debug = project.wpilib.getDebugOrDefault(false)
            artifacts {
                wpilibJava(getArtifactTypeClass("WPILibJavaArtifact")) {
                    debugJni = false
                }
                wpilibStaticFileDeploy(getArtifactTypeClass("FileTreeArtifact")) {
                    files = project.fileTree("src/main/deploy")
                    directory = "/home/systemcore/deploy"
                    deleteOldFiles = false
                }
            }
        }
    }
}
def deployArtifact = deploy.targets.systemcore.artifacts.wpilibJava
wpi.java.runSimWithDebugJni = false

dependencies {
    annotationProcessor wpi.java.deps.wpilibAnnotations()
    implementation wpi.java.deps.wpilib()
    implementation wpi.java.vendor.java()

    systemcoreDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.systemcore)
    systemcoreDebug wpi.java.vendor.jniDebug(wpi.platforms.systemcore)
    systemcoreRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.systemcore)
    systemcoreRelease wpi.java.vendor.jniRelease(wpi.platforms.systemcore)

    nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
    nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop)
    simulationDebug wpi.sim.enableDebug()
    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
    nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)
    simulationRelease wpi.sim.enableRelease()

    // AdvantageKit's @AutoLog processor, at the version vendordeps/AdvantageKit.json pins.
    def akit = new groovy.json.JsonSlurper().parse(file("vendordeps/AdvantageKit.json"))
    annotationProcessor "org.littletonrobotics.akit:akit-autolog:${akit.version}"

    // Null safety: JSpecify's annotations (the cross-industry standard), checked at compile time
    // by NullAway so a null can never reach the robot unannounced.
    implementation libs.jspecify

    // The libraries (lib/, each its own project): the world model (the validation kit, the field,
    // and the robot's definition), and localization and the simulation, which read it.
    implementation "com.michaelgrundvig.frc:frc-robot-model"
    implementation project(":localization")
    implementation project(":simulation")

    // Pitwall (pitwall/, its own project): the robot program's own web page.
    implementation project(":pitwall")
    // Writes the configuration records' Javadoc into the program as it compiles, so Pitwall's page
    // can say what each value means. It runs in the compiler only; none of it reaches the robot.
    annotationProcessor "com.michaelgrundvig.frc:docs-processor"

    compileOnly libs.recordbuilder.core
    compileOnly libs.errorprone.annotations
    testCompileOnly libs.errorprone.annotations
    testCompileOnly libs.recordbuilder.core
    annotationProcessor libs.recordbuilder.processor
    // The 2026 robots' fixtures declare a design's parts record as robot code does, built by name.
    testAnnotationProcessor libs.recordbuilder.processor

    // Static analysis (gradle/quality.gradle).
    errorprone libs.errorprone.core
    errorprone libs.nullaway

    testImplementation platform(libs.junit.bom)
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation libs.assertj.core
    testImplementation libs.archunit
    // The truth suite's known gaps, which the simulator's tests here share with its library's.
    testImplementation testFixtures(project(":simulation"))
}

application.mainClass = "frc.robot.Main"
deployArtifact.configureApplication(application)
wpi.java.configureApplication(application)
wpi.java.configureTestTasks(test)

// PhotonVision's camera simulation allocates OpenCV frames in native memory that only Java's
// collector frees (each Mat's finalizer), so outside the heap a simulating process grows with how
// seldom the collector runs: a study reached 4.8 GB resident on a 2 GB heap. A 32 MB young
// generation runs it often enough to hold that near 1 GB, at the same speed (docs/testing.md).
tasks.withType(Test).configureEach { jvmArgs "-Xmn32m" }
tasks.withType(JavaExec).configureEach { jvmArgs "-Xmn32m" }

tasks.named("test") {
    useJUnitPlatform()
    // A fresh test JVM every 20 test classes: one JVM running them all took 265 s and peaked at
    // 2.2 GB, eight fresh ones 124 s and 1.2 GB each (2026-10-02, with the young generation above).
    forkEvery = 20
    // Tests run in the build folder, so what simulated devices and logs write (CTRE's ctre_sim/,
    // for one) stays out of the project. A test finds project files through frc.projectDir.
    def work = layout.buildDirectory.dir("test-work")
    workingDir = work
    systemProperty "frc.projectDir", projectDir.absolutePath
    // How many seeds MonkeySimTest runs on each robot, or the one seed to run alone, the one a
    // failure names: -PmonkeySeeds=50, -PmonkeySeed=1234 (docs/testing.md).
    ["monkeySeeds", "monkeySeed"].each { name ->
        def value = providers.gradleProperty(name).orNull
        if (value != null) {
            systemProperty "frc.$name", value
        }
    }
    // Project files the tests check against the code, declared so Gradle knows the tests depend
    // on them: the values register (ValuesRegisterTest), the drive team's dashboard
    // (DashboardLayoutTest), and AdvantageScope's layout (AdvantageScopeLayoutTest). A quick build
    // (-Pquick) skips tests whose inputs haven't changed, so an undeclared file would let a change
    // to it pass untested.
    inputs.file("docs/values.md").withPropertyName("valuesRegister")
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file("layouts/elastic-layout.json").withPropertyName("dashboardLayout")
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file("layouts/advantagescope.json").withPropertyName("advantageScopeLayout")
            .withPathSensitivity(PathSensitivity.RELATIVE)
    // The guides' examples of code (DocExamplesTest): the guides, and the sources they're found in,
    // read as text.
    inputs.files(fileTree("docs") { include "**/*.md" }, "README.md", "AGENTS.md")
    .withPropertyName("guides").withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(fileTree("src") { include "*/java/**/*.java" }, fileTree("lib") { include "*/src/*/java/**/*.java" })
    .withPropertyName("documentedSources").withPathSensitivity(PathSensitivity.RELATIVE)
    // The models the layout names are those the build generates, before the tests (when the
    // AdvantageScope plugin is applied).
    inputs.files(fileTree("ascope_assets")).withPropertyName("advantageScopeAssets")
            .withPathSensitivity(PathSensitivity.RELATIVE)
    mustRunAfter tasks.matching { it.name == "advantageScopeAssets" }
    // GOLDEN_UPDATE=1 has EstimatorGoldenSimTest record its recording again, in src/test/resources,
    // which Gradle doesn't know the tests write: so with it, the tests always run, and never come
    // from the build cache, whatever ran before.
    def goldenUpdate = providers.environmentVariable("GOLDEN_UPDATE").orElse("")
    inputs.property("goldenUpdate", goldenUpdate)
    outputs.upToDateWhen { goldenUpdate.get() != "1" }
    outputs.doNotCacheIf("GOLDEN_UPDATE rewrites src/test/resources") { goldenUpdate.get() == "1" }
    doFirst { work.get().asFile.mkdirs() }
    // ReplayEndToEndTest's robot programs write their coverage beside the tests' own, for the
    // coverage report to count: the program's startup runs nowhere else.
    def endToEndCoverage = layout.buildDirectory.file("jacoco/end-to-end.exec")
    doFirst { endToEndCoverage.get().asFile.delete() }
}
tasks.named("jacocoTestReport") {
    executionData.from(fileTree(layout.buildDirectory.dir("jacoco")) { include "end-to-end.exec" })
}

// A copy of the source travels with every deploy, so the code on a robot can always be recovered
// and built again, checks and deploy and all: the robot program's code, and the libraries' and
// Pitwall's it's built with; the build itself (its files and plugins, the version catalog and
// checksums, the Gradle wrapper); what its checks read (the guides with the values register, the
// dashboard layouts, the coverage floor); the simulator GUI's defaults; and the team number deploy
// reads. Not AdvantageScope's assets, which the build writes again from Robots.java.
tasks.named("jar") {
    [
        "src",
        "vendordeps",
        "lib",
        "pitwall",
        "build-logic",
        "gradle",
        "docs",
        "layouts",
        "sim",
        ".wpilib"
    ].each { dir ->
        from(dir) {
            exclude "**/build/**", "**/.gradle/**"
            into "backup/${dir}"
        }
    }
    from([
        "settings.gradle",
        "build.gradle",
        "gradle.properties",
        "gradlew",
        "gradlew.bat",
        "coverage-floor.properties",
        "README.md",
        "AGENTS.md"
    ]) { into "backup" }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add "-XDstringConcat=inline"
}
// Pitwall's documentation processor documents only the configuration records, which it knows by
// their annotation's name.
tasks.named("compileJava") {
    options.compilerArgs.add "-Apitwall.docs.records=com.michaelgrundvig.frc.world.config.ConfigRecord"
}

// Gradle's configuration cache (gradle.properties) can't hold GradleRIO's own tasks yet: the
// simulator's run, deploy, vendordep, and WPILib's tools. A build that runs one goes without it, as
// every build used to. Marking them incompatible is enough for that; Gradle's internal
// ConfigurationCacheDegradation, where it's there as today, also keeps the problems the cache finds
// in them out of the output, so the build says so in a line. Should it change or go, the build
// works as before and lists them.
def withoutConfigurationCache = { Task task, String why ->
    task.notCompatibleWithConfigurationCache(why)
    try {
        def degrade = Class.forName("org.gradle.api.internal.ConfigurationCacheDegradation").methods.find {
            it.name == "requireDegradation" && it.parameterCount == 2 && it.parameterTypes[1] == String
        }
        degrade?.invoke(null, task, why)
    } catch (Exception | LinkageError ignored) {
        // Marked incompatible above, which is all a build needs.
    }
}
// GradleRIO's tasks that building and testing use work with it.
def cacheable = [
    "extractReleaseNative",
    "extractDebugNative",
    "downloadDepsPreemptively"
]
tasks.configureEach { task ->
    if (task.name == "run" || (task.class.name.startsWith("org.wpilib.") && !(task.name in cacheable))) {
        withoutConfigurationCache(task, "GradleRIO's state can't be kept in the configuration cache")
    }
}

// Nothing reaches a robot without a team number, or without passing every check.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.startsWith("deploy") }) {
        if (deploy.targets.systemcore.team <= 0) {
            throw new GradleException(
            "Set your team number before deploying: ./gradlew setTeamNumber -PteamNumber=NNNN")
        }
    }
}
// Every check means ci: the robot program's and Pitwall's, which the robot runs too.
tasks.matching { it.name == "deploy" }.configureEach {
    dependsOn "ci"
}

// Store the team number: ./gradlew setTeamNumber -PteamNumber=NNNN
tasks.register("setTeamNumber") {
    group = "DeployUtils" // beside deploy
    description = "Store the team number used for deploying: -PteamNumber=NNNN"
    def prefs = file(".wpilib/wpilib_preferences.json")
    def requested = project.findProperty("teamNumber")?.toString()
    doLast {
        if (requested == null || !requested.isInteger() || requested.toInteger() <= 0) {
            throw new GradleException("Usage: ./gradlew setTeamNumber -PteamNumber=NNNN")
        }
        def json = prefs.exists() ? new groovy.json.JsonSlurper().parse(prefs) : [:]
        json.teamNumber = requested.toInteger()
        prefs.parentFile.mkdirs()
        prefs.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)) + "\n"
        println "Team number ${json.teamNumber} stored in .wpilib/wpilib_preferences.json"
    }
}

apply from: "gradle/quality.gradle"     // formatting, static analysis, coverage, the ci task
apply from: "gradle/build-info.gradle"  // git SHA and build time, logged by the robot at startup
apply from: "gradle/simulation.gradle"  // simulator defaults for ./gradlew run
apply from: "gradle/studies.gradle"     // simulation studies, such as camera placement
