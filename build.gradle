// The robot program's build. GradleRIO is WPILib's Gradle plugin: it brings WPILib, the vendor
// libraries in vendordeps/, the simulator, and deploying to the robot.
plugins {
    id "java"
    id "application"
    id "org.wpilib.GradleRIO" version "2027.0.0-alpha-7"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Deploying to the robot's Systemcore (./gradlew deploy -PteamNumber=NNNN).
deploy {
    targets {
        systemcore(getTargetTypeClass("SystemCore")) {
            team = project.wpilib.getTeamOrDefault(0)
            useDefaultSystemcoreHostName()
            debug = project.wpilib.getDebugOrDefault(false)
            artifacts {
                wpilibJava(getArtifactTypeClass("WPILibJavaArtifact")) {
                }
                wpilibStaticFileDeploy(getArtifactTypeClass("FileTreeArtifact")) {
                    files = project.fileTree("src/main/deploy")
                    directory = "/home/systemcore/deploy"
                }
            }
        }
    }
}

// The robot program every robot shares comes from its own Maven repository.
repositories {
    maven { url = "https://mikegrundvig.github.io/frc-maven/" }
}

dependencies {
    annotationProcessor wpi.java.deps.wpilibAnnotations()
    implementation wpi.java.deps.wpilib()
    implementation wpi.java.vendor.java()

    systemcoreDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.systemcore)
    systemcoreDebug wpi.java.vendor.jniDebug(wpi.platforms.systemcore)
    systemcoreRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.systemcore)
    systemcoreRelease wpi.java.vendor.jniRelease(wpi.platforms.systemcore)

    nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
    nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop)
    simulationDebug wpi.sim.enableDebug()
    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
    nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)
    simulationRelease wpi.sim.enableRelease()

    // The robot program: the drivetrain, the simulator and Pitwall, its web page.
    implementation "com.michaelgrundvig.frc:frc-robot-runtime:2026.10.20"

    testImplementation platform("org.junit:junit-bom:6.1.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.assertj:assertj-core:3.27.7"
    // The simulator's test harness.
    testImplementation testFixtures("com.michaelgrundvig.frc:frc-robot-runtime:2026.10.20")
}

application.mainClass = "frc.robot.Main"
deploy.targets.systemcore.artifacts.wpilibJava.configureApplication(application)
wpi.java.configureApplication(application)
wpi.java.configureTestTasks(test)

tasks.named("test") {
    useJUnitPlatform()
    // Tests run in the build folder, so the files simulated devices write stay out of the project.
    def work = layout.buildDirectory.dir("test-work")
    workingDir = work
    doFirst { work.get().asFile.mkdirs() }
}

// The simulator, and driving the real chassis from a laptop (-PhwSim).
apply from: "gradle/simulation.gradle"
