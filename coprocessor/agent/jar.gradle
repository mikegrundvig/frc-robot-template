// What of the agent's build goes into the image: coprocessor-agent.jar. The recipe hash covers this
// file (RecipeHash.PATHS), and not the agent's build.gradle, whose tests and checks don't change
// what the image installs; RecipeBoundaryTest keeps the jar's rules here.
//
// coprocessor-agent.jar: the agent with everything it needs, run with `java -jar`. sqlite-jdbc's
// native libraries are kept for 64-bit ARM Linux (the coprocessors) and x86-64 Linux (CI, where
// images are stamped), and no others: a fifth of the size.
def keptNatives = [
    "org/sqlite/native/Linux/aarch64",
    "org/sqlite/native/Linux/x86_64"
]
tasks.named("jar") {
    archiveFileName = "coprocessor-agent.jar"
    manifest {
        attributes(
                "Main-Class": "com.michaelgrundvig.frc.coprocessor.agent.AgentMain",
                "Enable-Native-Access": "ALL-UNNAMED")
    }
    dependsOn configurations.runtimeClasspath
    from({
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }) {
        exclude "META-INF/MANIFEST.MF", "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA"
        exclude { element ->
            def path = element.relativePath.pathString
            path.startsWith("org/sqlite/native/") && !keptNatives.any { path.startsWith(it) || it.startsWith(path) }
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
