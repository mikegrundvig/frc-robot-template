// What the vision coprocessors and the robot program share: the coprocessor table, the agent's API
// records, and the JSON they're written in. Plain Java with no dependencies, so the agent stays
// small and the robot program gets nothing it doesn't already have; and free of WPILib, which the
// coprocessors don't run.

plugins {
    id "java-library"
    id "java-test-fixtures"
    id "jacoco"
    id "com.diffplug.spotless"
    id "net.ltgt.errorprone"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

base {
    archivesName = "coprocessor-common"
}

repositories {
    mavenCentral()
}

dependencies {
    api libs.jspecify // @Nullable in the records' signatures

    errorprone libs.errorprone.core
    errorprone libs.nullaway

    // PhotonVision's settings database for tests (src/testFixtures): this project's, and the
    // agent's. Settings go in and out of the database through JDBC's own API (java.sql), so only
    // the tests need a driver; the agent brings its own.
    testFixturesRuntimeOnly libs.sqlite.jdbc

    testImplementation platform(libs.junit.bom)
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation libs.assertj.core
    testImplementation libs.archunit
}

tasks.named("test") {
    useJUnitPlatform()
    jvmArgs "--enable-native-access=ALL-UNNAMED" // sqlite-jdbc loads its native library
    // The template's own PhotonVision lock, which a test checks against PhotonLib's vendordep.
    systemProperty "frc.projectDir", rootProject.projectDir.absolutePath
    inputs.file(rootProject.file("coprocessor/photonvision.lock")).withPropertyName("lock")
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file(rootProject.file("vendordeps/photonlib.json")).withPropertyName("vendordep")
            .withPathSensitivity(PathSensitivity.RELATIVE)
}

ext.nullSafePackages = "com.michaelgrundvig.frc.coprocessor"
apply from: rootProject.file("gradle/quality.gradle")
