# Gradle's own speed-ups, on for every build of the project (docs/editors.md).
#
# The configuration cache: a build that asks for what the last one did skips configuring the
# projects, the seconds before the first task runs. GradleRIO's own tasks that can't use it (run,
# deploy, and the rest, build.gradle) turn it off for the builds they're in.
org.gradle.configuration-cache=true
# The build cache: a task whose inputs match an earlier run's takes that run's outputs instead of
# running again, such as the tests after switching back to a branch or undoing an edit.
org.gradle.caching=true
# Projects build in parallel, as the configuration cache already has a build's tasks run, so a
# build without it (deploy, which runs ci first) runs a library's tests beside the robot program's
# too. At most two test JVMs run at once (gradle/quality.gradle).
org.gradle.parallel=true
