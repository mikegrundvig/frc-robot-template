// How ./gradlew run starts the robot program on this laptop.
//
//   ./gradlew run          the simulator: drive at http://localhost:5820/#sim
//   ./gradlew run -PhwSim  the real chassis, through its CANivore plugged into this laptop
//
// -PhwSim is CTRE's hardware-attached simulation: with it, WPILib's build picks Phoenix's
// libraries that talk to a real CANivore instead of simulated devices. The program then runs as it
// does on a robot: real devices, nothing simulated, starting disabled. Enable it from WPILib's
// simulator window, which opens with -PhwSim.

def hwSim = project.hasProperty("hwSim")
if (hwSim && System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("mac")) {
    throw new GradleException("-PhwSim needs Windows or Linux: CTRE has no hardware libraries for macOS")
}

// WPILib's simulator window: on with -PhwSim, where it enables the real robot. In the simulator,
// Pitwall's web page drives the robot instead.
wpi.sim.addGui().defaultEnabled = hwSim
wpi.sim.addDriverstation()

tasks.named("run") {
    if (hwSim) {
        systemProperty "frc.simMode", "REAL" // real devices, nothing simulated
        systemProperty "frc.sim.start", "disabled" // as a real robot starts
    } else {
        systemProperty "frc.sim.start", "ready" // disabled, one press of Enable from driving
    }
    // The simulator window's settings: the keyboard as the driver's gamepad. Copied in only when
    // missing, so your own changes to them are kept.
    def defaults = fileTree("sim") { include "simgui*.json" }
    def target = projectDir
    doFirst {
        if (!hwSim) {
            return
        }
        defaults.each { File f ->
            def dest = new File(target, f.name)
            if (!dest.exists()) {
                dest.text = f.text
            }
        }
    }
}
