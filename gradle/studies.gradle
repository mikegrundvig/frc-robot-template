// Studies (src/studies/java): simulations that answer a design question, such as where to mount
// the cameras. Their own source set, so none of their code runs on the robot; they use the team's
// robots and the runtime, and the tests check them like it (src/test/java/frc/robot/studies, the
// coverage floors). They are the team's tools, not the runtime's: they read Robots.all() and
// Robots.current() as defaults.
//
//   ./gradlew cameraStudy --args="--weights=weights.csv"   see runtime/docs/camera-placement.md
//   ./gradlew consistencyStudy                            see runtime/docs/testing.md

sourceSets {
    studies {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    test {
        compileClasspath += sourceSets.studies.output
        runtimeClasspath += sourceSets.studies.output
    }
}
configurations {
    studiesImplementation.extendsFrom implementation
    studiesRuntimeOnly.extendsFrom runtimeOnly
}
dependencies {
    // The studies drive the whole simulated robot, as tests do, with the runtime's harness.
    studiesImplementation testFixtures("com.michaelgrundvig.frc:frc-robot-runtime")
    studiesCompileOnly libs.recordbuilder.core
    studiesAnnotationProcessor libs.recordbuilder.processor
}

// Their coverage counts with the robot's, under the same floors.
tasks.named("jacocoTestReport") {
    sourceSets sourceSets.studies
}

tasks.register("cameraStudy", JavaExec) {
    group = "studies"
    description = "Score camera layouts all over the field. Results go to build/studies/."
    dependsOn "extractReleaseNative" // PhotonVision's simulation runs on native OpenCV
    classpath = sourceSets.studies.runtimeClasspath
    mainClass = "frc.robot.studies.CameraStudy"
    def natives = layout.buildDirectory.dir("jni/release").get().asFile.absolutePath
    // Where each system looks for native libraries, as GradleRIO sets them for the tests.
    systemProperty "java.library.path", natives
    environment "LD_LIBRARY_PATH", natives
    environment "DYLD_LIBRARY_PATH", natives
    environment "DYLD_FALLBACK_LIBRARY_PATH", natives
    environment "PATH", natives + File.pathSeparator + System.getenv("PATH")
    jvmArgs "--enable-native-access=ALL-UNNAMED"
}

tasks.register("consistencyStudy", JavaExec) {
    group = "studies"
    description = "Check that the pose estimator's uncertainty tells the truth. Results go to build/studies/."
    dependsOn "extractReleaseNative" // WPILib's simulation and PhotonVision's run on native code
    classpath = sourceSets.studies.runtimeClasspath
    mainClass = "frc.robot.studies.ConsistencyStudy"
    def natives = layout.buildDirectory.dir("jni/release").get().asFile.absolutePath
    // Where each system looks for native libraries, as GradleRIO sets them for the tests.
    systemProperty "java.library.path", natives
    environment "LD_LIBRARY_PATH", natives
    environment "DYLD_LIBRARY_PATH", natives
    environment "DYLD_FALLBACK_LIBRARY_PATH", natives
    environment "PATH", natives + File.pathSeparator + System.getenv("PATH")
    jvmArgs "--enable-native-access=ALL-UNNAMED"
    // The study runs the robot's commands, which suspend on the JDK's own continuations, as
    // GradleRIO opens them for the tests.
    jvmArgs "--add-opens", "java.base/jdk.internal.vm=ALL-UNNAMED", "--add-opens", "java.base/java.lang=ALL-UNNAMED"
}
