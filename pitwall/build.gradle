// Pitwall: the robot program's own web page and API: status, actions, and live, checked tuning of
// typed configuration. Its own project, free of robot code (Gradle keeps it so: it can't see the robot
// program), so it can become a library teams pull in.

plugins {
    id "java-library"
    id "jacoco"
    id "com.diffplug.spotless"
    id "net.ltgt.errorprone"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// WPILib's libraries, from wherever GradleRIO finds them for the robot program.
apply from: rootProject.file("gradle/wpilib-repositories.gradle")

dependencies {
    api libs.wpilib.units // measures appear in the tuner's API
    api libs.jspecify

    // The robot program's own libraries: WPILib, plus the vendor libraries in vendordeps/ (Commands
    // v3, AdvantageKit), exactly as GradleRIO gives them to the robot program. Every robot has them,
    // so Pitwall compiles against them and never bundles them. AdvantageKit is optional at run time:
    // with it, Pitwall logs its requests so replays reproduce them. Tests get the jars but no native
    // libraries, so they stay plain Java.
    compileOnly rootProject.wpi.java.deps.wpilib()
    compileOnly rootProject.wpi.java.vendor.java()
    testImplementation rootProject.wpi.java.deps.wpilib()
    testImplementation rootProject.wpi.java.vendor.java()

    errorprone libs.errorprone.core
    errorprone libs.nullaway

    // The tests' records are documented as the robot program's are, so ParameterDocs reads what the
    // processor really writes.
    testAnnotationProcessor project(":pitwall:docs-processor")

    testImplementation platform(libs.junit.bom)
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation libs.assertj.core
    testImplementation libs.archunit
}

tasks.named("test") {
    useJUnitPlatform()
}

ext.nullSafePackages = "com.michaelgrundvig.frc.pitwall"
apply from: rootProject.file("gradle/quality.gradle")
