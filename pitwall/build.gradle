// Pitwall: the robot program's own web page and API: status, actions, and live, checked tuning of
// typed configuration. Its own project, free of robot code (Gradle keeps it so: it can't see the robot
// program), so it can become a library teams pull in.

plugins {
    id "java-library"
    id "jacoco"
    id "com.diffplug.spotless"
    id "net.ltgt.errorprone"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// WPILib's libraries come from wherever GradleRIO finds them for the robot program: the WPILib
// installation's own repository when there is one, and WPILib's and the vendors' servers. Those
// servers may serve only the FRC libraries, as GradleRIO filters them for the robot program; all
// else, the compiler's plugins included, comes from Maven Central alone.
def frcGroups = /(org\.wpilib|edu\.wpi\.first|com\.ctre\.phoenix6|org\.photonvision|org\.littletonrobotics)(\..*)?/
def centralHost = ~/repo1?\.maven(\.apache)?\.org/
rootProject.repositories.withType(MavenArtifactRepository).each { source ->
    if (source.url.host != null && source.url.host ==~ centralHost) {
        return // declared once, below
    }
    repositories.maven {
        name = source.name
        url = source.url
        if (source.url.scheme != "file") {
            content { includeGroupByRegex frcGroups }
        }
    }
}
repositories {
    mavenCentral()
}

dependencies {
    api libs.wpilib.units // measures appear in the tuner's API
    api libs.jspecify

    // The robot program's own libraries: WPILib, plus the vendor libraries in vendordeps/ (Commands
    // v3, AdvantageKit), exactly as GradleRIO gives them to the robot program. Every robot has them,
    // so Pitwall compiles against them and never bundles them. AdvantageKit is optional at run time:
    // with it, Pitwall logs its requests so replays reproduce them. Tests get the jars but no native
    // libraries, so they stay plain Java.
    compileOnly rootProject.wpi.java.deps.wpilib()
    compileOnly rootProject.wpi.java.vendor.java()
    testImplementation rootProject.wpi.java.deps.wpilib()
    testImplementation rootProject.wpi.java.vendor.java()

    errorprone libs.errorprone.core
    errorprone libs.nullaway

    // The tests' records are documented as the robot program's are, so ParameterDocs reads what the
    // processor really writes.
    testAnnotationProcessor project(":pitwall:docs-processor")

    testImplementation platform(libs.junit.bom)
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation libs.assertj.core
    testImplementation libs.archunit
}

tasks.named("test") {
    useJUnitPlatform()
}

// three.js, which draws the page's scenes, from its WebJar on Maven Central. The WebJar holds all
// of three.js (13 MB); the page loads three files of it, three.js's own minified build and its orbit
// controls, which go into Pitwall's resources and are served at fixed routes (/three/...), as uPlot
// is. Nothing is downloaded by hand, and nothing is built.
//
// The orbit controls import three.js by its bare name ('three'). A browser resolves a bare name
// only through an import map, and an import map is written inline in the page, which the page's
// Content-Security-Policy (no inline script) refuses. So the copy imports the module beside it
// instead, and fails if the file stops matching what's rewritten.
configurations {
    threeJs {
        canBeConsumed = false
        canBeResolved = true
    }
}
dependencies {
    threeJs libs.three.webjar
}
def threeVersion = libs.versions.three.get()
def threeFiles = [
    "build/three.module.min.js",
    // what the page imports
    "build/three.core.min.js",
    // what that imports, from beside it
    "examples/jsm/controls/OrbitControls.js",
    // turning, panning, and zooming the view
    "LICENSE",
]
def threeOut = layout.buildDirectory.dir("generated/three")
def vendorThree = tasks.register("vendorThree", Sync) {
    description = "Copies the files of three.js the page loads out of its WebJar, its addon importing the module beside it."
    def webjar = configurations.threeJs
    inputs.files(webjar)
    from({ zipTree(webjar.singleFile) }) {
        threeFiles.each { include "META-INF/resources/webjars/three/${threeVersion}/${it}" }
        eachFile { it.path = "com/michaelgrundvig/frc/pitwall/three/${it.name}" }
        filesMatching("**/OrbitControls.js") {
            filter { line -> line.replaceAll(/from\s+(['"])three\1/, "from './three.module.min.js'") }
        }
    }
    includeEmptyDirs = false
    into threeOut
    doLast {
        def dir = threeOut.get().dir("com/michaelgrundvig/frc/pitwall/three").asFile
        def expected = threeFiles.collect { it.tokenize("/").last() } as Set
        def missing = expected - (dir.list() as Set)
        if (missing) {
            throw new GradleException("three.js ${threeVersion}'s WebJar has no ${missing}")
        }
        def controls = new File(dir, "OrbitControls.js").text
        if (controls =~ /from\s+['"]three['"]/ || !controls.contains("from './three.module.min.js'")) {
            throw new GradleException(
            "three.js ${threeVersion}'s OrbitControls.js no longer imports 'three' as pitwall/build.gradle rewrites it")
        }
        if (!new File(dir, "three.module.min.js").text.contains('from"./three.core.min.js"')) {
            throw new GradleException(
            "three.js ${threeVersion}'s three.module.min.js no longer imports ./three.core.min.js from beside it")
        }
    }
}
sourceSets.main.resources.srcDir(vendorThree)

ext.nullSafePackages = "com.michaelgrundvig.frc.pitwall"
apply from: rootProject.file("gradle/quality.gradle")
