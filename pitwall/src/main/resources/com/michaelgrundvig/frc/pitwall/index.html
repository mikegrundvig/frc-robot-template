<!doctype html>
<!-- Pitwall's page, served by the robot program (com.michaelgrundvig.frc.pitwall.PitwallServer),
     and a client of its API like any other. Plain HTML and JavaScript on purpose: nothing to build,
     nothing to install. This is its shell; the views are modules in page/ (page/main.js starts
     them), and they follow the robot through one event stream (/api/events): a snapshot, then only
     what changed. Plots are drawn by uPlot, bundled with Pitwall, since there's no internet at an
     event. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitwall</title>
<link rel="stylesheet" href="/uPlot.min.css">
<link rel="stylesheet" href="/page/pitwall.css">
<script>
  // The theme chosen here, before anything is drawn, so a dark page never flashes light.
  try {
    const theme = localStorage.getItem("pitwall.theme");
    if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
  } catch (error) {
    // Storage is off in this browser: the system's theme.
  }
</script>
<script src="/uPlot.iife.min.js"></script>
<script type="module" src="/page/main.js"></script>
</head>
<body>
<div class="shell">
  <header id="bar" class="bar"></header>
  <div id="band" class="band" hidden></div>
  <nav id="tabs" class="tabs" aria-label="Views"></nav>
  <main id="views" class="views"></main>
  <div id="applybar" class="applybar" hidden></div>
</div>
<dialog id="dialog"></dialog>
<div id="toast" class="toast" hidden></div>
<div id="live" class="sr" aria-live="polite"></div>
<div id="live-urgent" class="sr" aria-live="assertive"></div>
</body>
</html>
