// The runtime: the robot program every robot shares, which no team writes. Mechanisms built from a
// robot's definition, the drivetrain, vision, localization's wiring, autos, the loop, the venues,
// the simulator's adapters, and the harness a team tests its own robot with (test fixtures). It
// reads the world model, localization, the simulation and Pitwall, and nothing of the team's robot
// program (frc.robot): the team's Main hands it which robot this is, this season's field and what
// the robot does (RobotProgram.start), and Gradle keeps it so, since the runtime can't see the
// project that depends on it. Its code is in com.michaelgrundvig.frc.runtime.
//
// It borrows the build's WPILib and vendor libraries, as GradleRIO gives them to the robot program
// (the root build's), and never bundles them: every robot has them.

plugins {
    id "java-library"
    id "java-test-fixtures"
    id "jacoco"
    id "com.diffplug.spotless"
    id "net.ltgt.errorprone"
}

group = "com.michaelgrundvig.frc"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

base {
    archivesName = "frc-robot-runtime"
}

// WPILib's libraries, from wherever GradleRIO finds them for the robot program.
apply from: rootProject.file("gradle/wpilib-repositories.gradle")

dependencies {
    // The libraries the runtime is made of appear in its signatures.
    api "com.michaelgrundvig.frc:frc-robot-model"
    api project(":localization")
    api project(":simulation")
    api "com.michaelgrundvig.frc:frc-pitwall"
    api libs.jspecify

    // WPILib, and the vendor libraries in vendordeps/ (Commands v3, AdvantageKit, Phoenix, REVLib,
    // PhotonLib), exactly as GradleRIO gives them to the robot program. The robot program has them
    // at run time; here they compile the runtime, its fixtures and its tests.
    compileOnly rootProject.wpi.java.deps.wpilib()
    compileOnly rootProject.wpi.java.vendor.java()
    testFixturesCompileOnly rootProject.wpi.java.deps.wpilib()
    testFixturesCompileOnly rootProject.wpi.java.vendor.java()
    testImplementation rootProject.wpi.java.deps.wpilib()
    testImplementation rootProject.wpi.java.vendor.java()
    testRuntimeOnly rootProject.wpi.java.deps.wpilibJniRelease(rootProject.wpi.platforms.desktop)
    testRuntimeOnly rootProject.wpi.java.vendor.jniRelease(rootProject.wpi.platforms.desktop)

    // WPILib's annotations, and AdvantageKit's @AutoLog processor, at the version
    // vendordeps/AdvantageKit.json pins.
    annotationProcessor rootProject.wpi.java.deps.wpilibAnnotations()
    def akit = new groovy.json.JsonSlurper().parse(rootProject.file("vendordeps/AdvantageKit.json"))
    annotationProcessor "org.littletonrobotics.akit:akit-autolog:${akit.version}"

    // Configuration records are built by name, through builders generated as they compile, and
    // their Javadoc is written into the jar so Pitwall's page can say what each value means.
    compileOnly libs.recordbuilder.core
    compileOnly libs.errorprone.annotations
    annotationProcessor libs.recordbuilder.processor
    annotationProcessor "com.michaelgrundvig.frc:docs-processor"
    testFixturesCompileOnly libs.recordbuilder.core
    testFixturesCompileOnly libs.errorprone.annotations
    testFixturesAnnotationProcessor libs.recordbuilder.processor
    testCompileOnly libs.errorprone.annotations
    testCompileOnly libs.recordbuilder.core
    testAnnotationProcessor libs.recordbuilder.processor

    errorprone libs.errorprone.core
    errorprone libs.nullaway

    // What a team tests its own robot with: the simulator's harness (RobotSim), the monkey, the
    // invariants, the auto check. JUnit's API and AssertJ appear in them; the architecture rules
    // are shared with the team's own architecture test.
    testFixturesApi platform(libs.junit.bom)
    testFixturesApi "org.junit.jupiter:junit-jupiter-api"
    testFixturesApi libs.assertj.core
    testFixturesApi libs.archunit
    // The truth suite's known gaps, which the simulator's tests share with its library's.
    testFixturesApi testFixtures(project(":simulation"))

    testImplementation platform(libs.junit.bom)
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation libs.assertj.core
    testImplementation libs.archunit
}

tasks.withType(JavaCompile).configureEach {
    // The simulator runs in the robot's process.
    options.compilerArgs.add "-XDstringConcat=inline"
}
tasks.named("compileJava") {
    options.compilerArgs.add "-Apitwall.docs.records=com.michaelgrundvig.frc.world.config.ConfigRecord"
}

// PhotonVision's camera simulation allocates OpenCV frames in native memory that only Java's
// collector frees (each Mat's finalizer), so outside the heap a simulating process grows with how
// seldom the collector runs. A 32 MB young generation runs it often enough (docs/testing.md).
tasks.withType(Test).configureEach { jvmArgs "-Xmn32m" }

// The tests run the robot program's simulation: WPILib's and the vendors' native libraries, which
// GradleRIO extracts for the robot program, and the JVM options it sets for its tests.
rootProject.wpi.java.configureTestTasks(tasks.named("test").get())

tasks.named("test") {
    useJUnitPlatform()
    // A fresh test JVM every 20 test classes (the root project's tests do the same).
    forkEvery = 20
    // Tests run in the build folder, so what simulated devices and logs write (CTRE's ctre_sim/,
    // for one) stays out of the project. A test finds project files through frc.projectDir.
    def work = layout.buildDirectory.dir("test-work")
    workingDir = work
    systemProperty "frc.projectDir", projectDir.absolutePath
    // How many seeds MonkeySimTest runs on each robot, or the one seed to run alone, the one a
    // failure names: -PmonkeySeeds=50, -PmonkeySeed=1234 (docs/testing.md).
    ["monkeySeeds", "monkeySeed"].each { name ->
        def value = providers.gradleProperty(name).orNull
        if (value != null) {
            systemProperty "frc.$name", value
        }
    }
    // GOLDEN_UPDATE=1 has the recorded tests record their recordings again, in src/test/resources,
    // which Gradle doesn't know the tests write: so with it, the tests always run, and never come
    // from the build cache, whatever ran before.
    def goldenUpdate = providers.environmentVariable("GOLDEN_UPDATE").orElse("")
    inputs.property("goldenUpdate", goldenUpdate)
    outputs.upToDateWhen { goldenUpdate.get() != "1" }
    outputs.doNotCacheIf("GOLDEN_UPDATE rewrites src/test/resources") { goldenUpdate.get() == "1" }
    doFirst { work.get().asFile.mkdirs() }
    // ReplayEndToEndTest's robot programs write their coverage beside the tests' own, for the
    // coverage report to count: the program's startup runs nowhere else.
    // It's an output of the tests, said so: restored from the build cache with their own coverage,
    // or the coverage check would count the program's startup as never run.
    def endToEndCoverage = layout.buildDirectory.file("jacoco/end-to-end.exec")
    outputs.file(endToEndCoverage).withPropertyName("endToEndCoverage").optional()
    doFirst { endToEndCoverage.get().asFile.delete() }
}
tasks.named("jacocoTestReport") {
    executionData.from(fileTree(layout.buildDirectory.dir("jacoco")) { include "end-to-end.exec" })
}

apply from: rootProject.file("gradle/quality.gradle")
