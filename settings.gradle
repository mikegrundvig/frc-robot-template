pluginManagement {
    repositories {
        gradlePluginPortal()
    }
    // The runtime's plugins (runtime/build-logic): one per tool whose files the build generates
    // from the robot's configuration, such as AdvantageScope's robot assets. A plugin that lives in
    // an included build's own included build is found only by naming its folder here.
    if (!file("runtime/build-logic/settings.gradle").exists()) {
        throw new GradleException("The runtime isn't checked out (runtime/ is empty). Run: git submodule update --init")
    }
    includeBuild("runtime/build-logic")
}

plugins {
    // Downloads the JDK the build asks for (build.gradle, java.toolchain), so ./gradlew works on any
    // machine with any Java installed. No JDK setup and no WPILib installer needed to build.
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

rootProject.name = "frc-robot-template"

// Pitwall, the robot program's own web page (status, actions, and live tuning), is a repository of
// its own too, a git submodule (pitwall/) built from that folder as part of this build: whatever
// asks for com.michaelgrundvig.frc:frc-pitwall gets what the folder holds. It is free of robot code.
if (!file("pitwall/settings.gradle").exists()) {
    throw new GradleException("Pitwall isn't checked out (pitwall/ is empty). Run: git submodule update --init")
}
includeBuild("pitwall")
// The robot model (the validation kit, the field, and the robot's definition) is a repository of
// its own, here as a git submodule (model/) and built from that folder as part of this build:
// whatever asks for com.michaelgrundvig.frc:frc-robot-model gets what the folder holds, with no
// version to bump. With it comes the documentation processor, which reads the configuration
// records' Javadoc as each project compiles, so Pitwall's page can say what each value means. A
// change to the model is made in that folder and committed there, then here.
if (!file("model/settings.gradle").exists()) {
    throw new GradleException("The robot model isn't checked out (model/ is empty). Run: git submodule update --init")
}
includeBuild("model")
// Localization (localization/): where the robot is, from its wheels, its IMUs and its cameras. The
// contract a localizer keeps, the default localizer and WPILib's, and the solving of camera images
// into measurements. A repository of its own too, a git submodule built from that folder as part
// of this build: whatever asks for com.michaelgrundvig.frc:frc-localization gets what the folder
// holds. It reads the model, this build's (above), and nothing of the runtime or Pitwall.
if (!file("localization/settings.gradle").exists()) {
    throw new GradleException("Localization isn't checked out (localization/ is empty). Run: git submodule update --init")
}
includeBuild("localization")
// The runtime (runtime/): the robot program every robot shares, which no team writes, with the
// simulation it runs and the harness a team tests with. The
// team's robot program, this project's root, hands it which robot this is, this season's field and
// what the robot does; the runtime reads nothing of it, and Gradle keeps it so. It is a repository
// of its own too, a git submodule built from that folder as part of this build: whatever asks for
// com.michaelgrundvig.frc:frc-robot-runtime gets what the folder holds. It uses this build's
// model/, localization/ and pitwall/ (above), not copies of its own, so a checkout needs no
// recursive submodule initialization.
if (!file("runtime/settings.gradle").exists()) {
    throw new GradleException("The runtime isn't checked out (runtime/ is empty). Run: git submodule update --init")
}
includeBuild("runtime")
