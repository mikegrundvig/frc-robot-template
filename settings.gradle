pluginManagement {
    repositories {
        gradlePluginPortal()
        // The FRC libraries' Maven repository (build.gradle says more), for the runtime's plugins:
        // one per tool whose files the build generates from the robot's configuration, such as
        // AdvantageScope's robot assets. Only it serves them. -PfrcMaven=<url> reads them from
        // another copy of the repository.
        exclusiveContent {
            forRepository {
                maven {
                    name = "frcMaven"
                    url = providers.gradleProperty("frcMaven").orElse("https://mikegrundvig.github.io/frc-maven/").get()
                }
            }
            filter {
                includeGroup "com.michaelgrundvig.frc"
                includeGroup "frc.advantagescope-assets"
            }
        }
    }
    // Developing the libraries (-PlocalLibs, below): with the runtime's clone there, its plugins
    // are built from it too, in place of the published ones.
    def localLibs = providers.gradleProperty("localLibs").orNull
    if (localLibs != null) {
        def folder = new File(localLibs.startsWith("~") ? System.getProperty("user.home") + localLibs.substring(1) : localLibs)
        folder = folder.absolute ? folder : new File(settingsDir, localLibs)
        def plugins = new File(folder, "runtime/build-logic")
        if (new File(plugins, "settings.gradle").exists()) {
            includeBuild(plugins)
        }
    }
}

plugins {
    // Downloads the JDK the build asks for (build.gradle, java.toolchain), so ./gradlew works on any
    // machine with any Java installed. No JDK setup and no WPILib installer needed to build.
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

rootProject.name = "frc-robot-template"

// The libraries the robot program is built on, each a repository of its own: the runtime (the robot
// program every robot shares, with the simulation and the harness a team tests with), the robot
// model, localization and Pitwall. They come from their Maven repository at one version, the
// catalog's frc-libs (gradle/libs.versions.toml, build.gradle), like any other library.
//
// Developing them: -PlocalLibs=<folder> builds those found in that folder's model/, localization/,
// pitwall/ and runtime/ (each a clone of its repository) from their source, in place of the
// published versions, so a change to one is seen in this robot program before it's published
// (docs/upgrading.md, Developing the libraries). Off unless asked for; a team never needs it.
def localLibs = providers.gradleProperty("localLibs").orNull
if (localLibs != null) {
    def folder = new File(localLibs.startsWith("~") ? System.getProperty("user.home") + localLibs.substring(1) : localLibs)
    folder = folder.absolute ? folder : new File(settingsDir, localLibs)
    if (!folder.directory) {
        throw new GradleException("-PlocalLibs=${localLibs} isn't a folder: name the one holding model/, localization/, pitwall/ and runtime/")
    }
    [
        "model",
        "localization",
        "pitwall",
        "runtime"
    ].each { name ->
        def library = new File(folder, name)
        if (new File(library, "settings.gradle").exists()) {
            logger.lifecycle("Building ${name} from ${library} (-PlocalLibs)")
            includeBuild(library) {
                // The model's processor's project is docs-processor; it's published as
                // frc-docs-processor. Every other project is named as it's published.
                if (name == "model") {
                    dependencySubstitution {
                        substitute module("com.michaelgrundvig.frc:frc-docs-processor") using project(":docs-processor")
                    }
                }
            }
        }
    }
}
