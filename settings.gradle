pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    // Downloads the JDK the build asks for (build.gradle, java.toolchain), so ./gradlew works on any
    // machine with any Java installed. No JDK setup and no WPILib installer needed to build.
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

rootProject.name = "frc-robot-template"

// Pitwall, the robot program's own web page (status, actions, and live tuning): its own project, free of robot
// code, so it can become a library teams pull in.
include "pitwall"
// Pitwall's documentation processor, which reads the configuration records' Javadoc as the robot program
// compiles, so the page can say what each value means. A compiler plugin, so it's a project of its own.
include "pitwall:docs-processor"
// The vision coprocessors (coprocessor/): what they share with the robot program (the table, the
// agent's API, the settings' canonical form), and the health agent each one runs.
include "coprocessor-common"
project(":coprocessor-common").projectDir = file("coprocessor/common")
